name: vizir
description: "Vızır - Hız ve Macera Adası. Çocuklar için eğitici yarış ve macera oyunu."
publish_to: 'none'
version: 0.3.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.0
  shared_preferences: ^2.3.0
  audioplayers: ^6.1.0
  sherpa_onnx: '>=1.12.0 <2.0.0'
  path_provider: ^2.1.0
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/sfx/
    - assets/tts/
