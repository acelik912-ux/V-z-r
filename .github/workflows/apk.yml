name: APK oluştur

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android dosyalarını oluştur
        run: |
          flutter create --platforms=android --project-name vizir --org com.acelik912 .
          python3 tool/patch_android.py

      - name: Sabit imza anahtarını yerleştir (güncellemeler üst üste kurulabilsin)
        run: |
          mkdir -p ~/.android
          cp tool/debug.keystore ~/.android/debug.keystore

      - name: Doğal ses modelini indir (Piper, Türkçe erkek sesi)
        env:
          VOICE: fettah
        run: |
          curl -sL "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-tr_TR-${VOICE}-medium-int8.tar.bz2" | tar xj -C /tmp
          D=/tmp/vits-piper-tr_TR-${VOICE}-medium-int8
          cp $D/*.onnx assets/tts/model.onnx
          cp $D/tokens.txt assets/tts/tokens.txt
          cp $D/MODEL_CARD assets/tts/MODEL_CARD.txt || true
          cd $D/espeak-ng-data && find . -name '*_dict' ! -name 'tr_dict' -delete && zip -qr "$GITHUB_WORKSPACE/assets/tts/espeak.zip" *
          ls -la "$GITHUB_WORKSPACE/assets/tts"

      - run: flutter pub get

      - name: Araba önizlemeleri (görsel kontrol)
        continue-on-error: true
        run: flutter test test/render_preview_test.dart

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onizlemeler
          path: previews/
          if-no-files-found: ignore

      - name: APK derle
        run: flutter build apk --release --target-platform android-arm64 --build-number=${{ github.run_number }}

      - name: APK kontrolü (imza ve sürüm)
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/apksigner verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk | head -20
          $BT/apksigner verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep -q "CN=Vizir" || (echo "HATA: sabit anahtarla imzalanmadı" && exit 1)
          $BT/aapt2 dump badging build/app/outputs/flutter-apk/app-release.apk | grep -E "package:|sdkVersion|targetSdk|native-code" || true
          ls -la build/app/outputs/flutter-apk/

      - name: APK'yı adlandır
        run: cp build/app/outputs/flutter-apk/app-release.apk vizir-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: vizir-apk
          path: vizir-${{ github.run_number }}.apk

      - name: Sürüm sayfasına koy
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Vızır 0.1.${{ github.run_number }}
          body: Telefona kurmak için aşağıdaki vizir APK dosyasına dokunun.
          files: vizir-${{ github.run_number }}.apk
