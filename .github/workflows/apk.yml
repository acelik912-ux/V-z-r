name: APK oluştur

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android dosyalarını oluştur
        run: |
          flutter create --platforms=android --project-name vizir --org com.acelik912 .
          python3 tool/patch_android.py

      - name: Sabit imza anahtarını yerleştir (güncellemeler üst üste kurulabilsin)
        run: |
          mkdir -p ~/.android
          cp tool/debug.keystore ~/.android/debug.keystore

      - run: flutter pub get

      - name: APK derle
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: APK'yı adlandır
        run: cp build/app/outputs/flutter-apk/app-release.apk vizir-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: vizir-apk
          path: vizir-${{ github.run_number }}.apk

      - name: Sürüm sayfasına koy
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Vızır 0.1.${{ github.run_number }}
          body: Telefona kurmak için aşağıdaki vizir APK dosyasına dokunun.
          files: vizir-${{ github.run_number }}.apk
