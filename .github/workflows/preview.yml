name: Önizleme

on:
  push:
    branches: [onizleme]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Kod kontrolü
        continue-on-error: true
        run: |
          mkdir -p previews
          flutter analyze --no-fatal-infos --no-fatal-warnings lib test > previews/analyze.txt 2>&1 || true
          cat previews/analyze.txt
      - name: Araba önizlemeleri
        continue-on-error: true
        run: flutter test test/render_preview_test.dart test/icon_render_test.dart
      - name: Ekran önizlemeleri
        continue-on-error: true
        run: |
          flutter test test/screens_preview_test.dart > previews/test.txt 2>&1 || true
          tail -80 previews/test.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onizlemeler
          path: previews/
          if-no-files-found: ignore
      - name: Görselleri ayrı dala koy
        if: always()
        run: |
          mkdir -p /tmp/png && cp -r previews/* /tmp/png/ || true
          cd /tmp/png
          git init -q -b onizleme-png
          git config user.name ci && git config user.email ci@example.com
          git add -A && git commit -q -m "önizleme ${{ github.run_number }}" || true
          git push -f -q https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} onizleme-png
