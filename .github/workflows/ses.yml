name: Ses örnekleri

on:
  push:
    branches: [onizleme]
    paths: ['.github/workflows/ses.yml', 'tool/voice_samples.py']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Türkçe modelleri bul ve indir
        run: |
          mkdir -p /tmp/models && cd /tmp/models
          curl -s "https://api.github.com/repos/k2-fsa/sherpa-onnx/releases/tags/tts-models" > rel.json
          python3 - <<'PY' > list.txt
          import json
          r = json.load(open('rel.json'))
          for a in r.get('assets', []):
              n = a['name']
              if 'tr_TR' in n or 'turk' in n.lower():
                  print(n, a['size'], a['browser_download_url'])
          PY
          cat list.txt
          # sayfa 1'de yoksa diğer sayfalar
          for page in 2 3 4 5 6 7 8; do
            curl -s "https://api.github.com/repos/k2-fsa/sherpa-onnx/releases/tags/tts-models" >/dev/null
          done
          while read -r name size url; do
            case "$name" in *.tar.bz2) curl -sL "$url" -o "$name" && tar xjf "$name";; esac
          done < list.txt
          ls -la
      - name: Örnek sesleri üret
        run: |
          pip install -q "sherpa-onnx<2" soundfile numpy && pip show sherpa-onnx | head -2
          sudo apt-get install -y -q ffmpeg > /dev/null
          python3 tool/voice_samples.py /tmp/models /tmp/out
          ls -la /tmp/out
      - name: Sonuçları dala koy
        run: |
          cd /tmp/out
          git init -q -b ses-ornek
          git config user.name ci && git config user.email ci@example.com
          git add -A && git commit -q -m "ses örnekleri"
          git push -f -q https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} ses-ornek
